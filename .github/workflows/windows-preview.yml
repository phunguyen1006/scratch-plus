name: Windows preview build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Test journal calculations
        run: node --test tests/journal.test.mjs
      - name: Build Windows x64 installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --config src-tauri/tauri.preview.conf.json
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Scratch-Windows-x64-preview
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
