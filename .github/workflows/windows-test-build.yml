name: Windows test build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-test-build.yml
      - src-tauri/tauri.ci.conf.json

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --config src-tauri/tauri.ci.conf.json

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: scratch-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
